<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | School Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <h2>Reset Password</h2>
            <p style="text-align: center; color: #6b7280; font-size: 0.92rem; margin-top: -12px; margin-bottom: 20px;">
                Enter your registered mobile number to set a new password.
            </p>

            <div id="statusAlert" class="alert-box" style="display: none;"></div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="resetRole">Select Role</label>
                    <select id="resetRole">
                        <option value="all">Any / Auto-detect</option>
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                        <option value="admin">Admin</option>
                        <option value="parent">Parent</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="resetPhone">Registered Mobile Number</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="tel" id="resetPhone" placeholder="Enter 10-digit Mobile Number" pattern="[0-9]{10}" maxlength="10" required>
                        <button type="button" id="btnVerifyPhone" class="secondary-btn" style="width: auto; white-space: nowrap; padding: 10px 14px;">Verify</button>
                    </div>
                    <small id="phoneInfo" style="display: block; margin-top: 6px; font-size: 0.85rem; color: #4b5563;"></small>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter New Password (min 4 characters)" required minlength="4">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter New Password" required minlength="4">
                </div>

                <button class="primary-btn" type="submit" id="resetSubmitBtn" style="margin-top: 8px;">Reset Password</button>
            </form>

            <p class="auth-link">Remembered your password? <a href="index.html">Back to Login</a></p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
