<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #2c3e50;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 {
            margin: 0;
            font-size: 24px;
        }
        .navbar button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin: 0 0 15px 0;
            color: #2c3e50;
            font-size: 16px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 10px;
        }
        .stat-label {
            color: #666;
            font-size: 14px;
        }
        .link-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .link-list li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .link-list a {
            color: #3498db;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .link-list a:hover {
            color: #2980b9;
        }
        .chart-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            position: relative;
            height: 400px;
        }
        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .quick-link-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .quick-link-btn:hover {
            transform: translateY(-5px);
        }
        .quick-link-btn.fees {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .quick-link-btn.attendance {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .quick-link-btn.exams {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }
        .quick-link-btn.messages {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Parent Dashboard</h1>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="container">
        <div class="quick-links">
            <button class="quick-link-btn fees" onclick="openPage('student-fees.html')">View Fees</button>
            <button class="quick-link-btn attendance" onclick="openPage('student-attendance.html')">Attendance</button>
            <button class="quick-link-btn exams" onclick="openPage('student-exams.html')">Exams</button>
            <button class="quick-link-btn messages" onclick="openPage('messages.html')">Messages</button>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>Child's Marks</h3>
                <div class="stat-value" id="avgMarks">-</div>
                <div class="stat-label">Average Score</div>
            </div>

            <div class="card">
                <h3>Attendance</h3>
                <div class="stat-value" id="attendance">-</div>
                <div class="stat-label">Attendance %</div>
            </div>

            <div class="card">
                <h3>Pending Fees</h3>
                <div class="stat-value" id="pendingFees">₹-</div>
                <div class="stat-label">Amount Due</div>
                <button id="parentPayFeesButton" class="quick-link-btn fees" type="button" onclick="payChildFees()" disabled>Pay Online</button>
            </div>

            <div class="card">
                <h3>Upcoming Exams</h3>
                <div class="stat-value" id="upcomingExams">-</div>
                <div class="stat-label">Scheduled Soon</div>
            </div>
        </div>

        <div class="chart-container">
            <h3 style="margin-top: 0;">Performance Overview</h3>
            <canvas id="performanceChart"></canvas>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>Recent Announcements</h3>
                <ul class="link-list" id="noticesList">
                    <li><a href="#">Loading...</a></li>
                </ul>
            </div>

            <div class="card">
                <h3>Important Links</h3>
                <ul class="link-list">
                    <li><a href="#">School Website <span>→</span></a></li>
                    <li><a href="#">Download Prospectus <span>→</span></a></li>
                    <li><a href="#">Contact Admin <span>→</span></a></li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.SCHOOL_API_BASE_URL || 'http://localhost:5001/api';
        const studentId = localStorage.getItem('childId'); // Parent stores child's ID
        let pendingFeeAmount = 0;

        window.onload = () => {
            loadDashboardData();
        };

        async function loadDashboardData() {
            try {
                // Load attendance
                const attendanceData = await fetch(`${API_BASE}/attendance`);
                const attendance = await attendanceData.json();
                const studentAttendance = attendance.filter(a => a.student === studentId);
                const percentage = studentAttendance.length > 0 
                    ? ((studentAttendance.filter(a => a.status === 'present').length / studentAttendance.length) * 100).toFixed(2)
                    : 0;
                document.getElementById('attendance').textContent = percentage + '%';

                // Load marks
                const marksData = await fetch(`${API_BASE}/marks`);
                const marks = await marksData.json();
                const studentMarks = marks.filter(m => m.student === studentId);
                const avgMarks = studentMarks.length > 0
                    ? (studentMarks.reduce((sum, m) => sum + m.marksObtained, 0) / studentMarks.length).toFixed(2)
                    : 0;
                document.getElementById('avgMarks').textContent = avgMarks;

                // Load fees
                const feesData = await fetch(`${API_BASE}/fees/student/${studentId}`);
                const fees = await feesData.json();
                const pendingFees = fees
                    .filter(f => f.status === 'pending' || f.status === 'overdue')
                    .reduce((sum, f) => sum + f.amount, 0);
                pendingFeeAmount = pendingFees;
                document.getElementById('pendingFees').textContent = '₹' + pendingFees;
                document.getElementById('parentPayFeesButton').disabled = pendingFees <= 0;

                // Load exams
                const examsData = await fetch(`${API_BASE}/exams`);
                const exams = await examsData.json();
                const upcomingExams = exams.filter(e => e.status === 'upcoming').length;
                document.getElementById('upcomingExams').textContent = upcomingExams;

                // Load notices
                const noticesData = await fetch(`${API_BASE}/notices`);
                const notices = await noticesData.json();
                const noticesList = document.getElementById('noticesList');
                noticesList.innerHTML = '';
                notices.slice(0, 5).forEach(notice => {
                    const li = document.createElement('li');
                    li.innerHTML = `<a href="#"><strong>${notice.title}</strong></a>`;
                    noticesList.appendChild(li);
                });

                // Draw chart
                drawPerformanceChart(studentMarks);
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        async function payChildFees() {
            const token = localStorage.getItem('school_token') || localStorage.getItem('token');
            if (!token) return alert('Please sign in again to make a payment.');
            if (!window.Razorpay) return alert('Razorpay Checkout could not be loaded.');
            if (!pendingFeeAmount) return alert('There is no outstanding fee balance.');
            try {
                const orderResponse = await fetch(`${API_BASE}/fees/create-razorpay-order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                    body: JSON.stringify({ amount: pendingFeeAmount })
                });
                const order = await orderResponse.json();
                if (!orderResponse.ok) throw new Error(order.message || 'Unable to create payment order.');
                const checkout = new Razorpay({
                    key: order.keyId,
                    amount: order.amount,
                    currency: order.currency,
                    name: 'School Management',
                    description: 'Student fee payment',
                    order_id: order.orderId,
                    prefill: { name: order.studentName, email: order.studentEmail },
                    handler: async function (payment) {
                        try {
                            const verifyResponse = await fetch(`${API_BASE}/fees/verify-payment`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                                body: JSON.stringify(payment)
                            });
                            const result = await verifyResponse.json();
                            if (!verifyResponse.ok) throw new Error(result.message || 'Payment verification failed.');
                            const jsPDF = window.jspdf && window.jspdf.jsPDF;
                            if (!jsPDF) throw new Error('Payment verified, but PDF library is unavailable.');
                            const receipt = new jsPDF();
                            receipt.setFontSize(16);
                            receipt.text('Official Student Fee Receipt', 14, 20);
                            receipt.setFontSize(11);
                            receipt.text(`Student: ${result.receipt.studentName}`, 14, 34);
                            receipt.text(`Receipt No: ${result.receipt.receiptNo}`, 14, 42);
                            receipt.text(`Transaction ID: ${result.receipt.transactionId}`, 14, 50);
                            receipt.text(`Amount: INR ${result.receipt.amount.toLocaleString('en-IN')}`, 14, 58);
                            receipt.text(`Date: ${new Date(result.receipt.date).toLocaleDateString()}`, 14, 66);
                            receipt.text('Status: PAID', 14, 74);
                            receipt.save(`Fee_Receipt_${result.receipt.receiptNo}.pdf`);
                            alert(`Payment verified. Receipt: ${result.receipt.receiptNo}`);
                            loadDashboardData();
                        } catch (error) {
                            alert(error.message);
                        }
                    }
                });
                checkout.on('payment.failed', event => alert(event.error.description || 'Payment failed.'));
                checkout.open();
            } catch (error) {
                alert(error.message);
            }
        }

        function drawPerformanceChart(marks) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            
            const labels = marks.map(m => m.subject ? m.subject.name : 'Unknown').slice(0, 5);
            const data = marks.map(m => m.marksObtained).slice(0, 5);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Marks Obtained',
                        data: data,
                        backgroundColor: '#3498db',
                        borderColor: '#2980b9',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    }
                }
            });
        }

        function openPage(page) {
            window.location.href = page;
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userId');
            localStorage.removeItem('childId');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
