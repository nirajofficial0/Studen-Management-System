<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exams - Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-upcoming {
            background-color: #FFC107;
            color: white;
        }
        .status-ongoing {
            background-color: #2196F3;
            color: white;
        }
        .status-completed {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Exam Management</h1>
            <button class="btn-primary" onclick="openAddModal()">+ Schedule Exam</button>
        </div>

        <table id="examTable">
            <thead>
                <tr>
                    <th>Exam Name</th>
                    <th>Subject</th>
                    <th>Class</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Duration (mins)</th>
                    <th>Total Marks</th>
                    <th>Status</th>
                    <th>Location</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE = window.SCHOOL_API_BASE_URL || 'http://localhost:5001/api';

        window.onload = () => {
            loadExams();
        };

        async function loadExams() {
            try {
                const response = await fetch(`${API_BASE}/exams`);
                const exams = await response.json();
                displayExams(exams);
            } catch (error) {
                console.error('Error loading exams:', error);
            }
        }

        function displayExams(exams) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            exams.forEach(exam => {
                const row = document.createElement('tr');
                const statusClass = `status-${exam.status}`;
                
                row.innerHTML = `
                    <td>${exam.name}</td>
                    <td>${exam.subject ? exam.subject.name : 'N/A'}</td>
                    <td>${exam.class ? exam.class.name : 'N/A'}</td>
                    <td>${new Date(exam.date).toLocaleDateString()}</td>
                    <td>${exam.startTime} - ${exam.endTime}</td>
                    <td>${exam.duration || 'N/A'}</td>
                    <td>${exam.totalMarks}</td>
                    <td><span class="status-badge ${statusClass}">${exam.status.toUpperCase()}</span></td>
                    <td>${exam.location || 'N/A'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function openAddModal() {
            alert('Exam scheduling modal will open here');
        }
    </script>
</body>
</html>
