<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #2c3e50;
            padding: 15px 30px;
            color: white;
        }
        .navbar h1 {
            margin: 0;
            font-size: 24px;
        }
        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 4px solid #3498db;
        }
        .stat-card.green {
            border-top-color: #2ecc71;
        }
        .stat-card.orange {
            border-top-color: #f39c12;
        }
        .stat-card.red {
            border-top-color: #e74c3c;
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
            color: #2c3e50;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
            height: 400px;
        }
        .chart-container h3 {
            margin: 0 0 20px 0;
            color: #2c3e50;
        }
        canvas {
            max-height: 350px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>📊 Analytics Dashboard</h1>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="value" id="totalUsers">0</div>
            </div>
            <div class="stat-card green">
                <h3>Total Students</h3>
                <div class="value" id="totalStudents">0</div>
            </div>
            <div class="stat-card orange">
                <h3>Total Teachers</h3>
                <div class="value" id="totalTeachers">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Classes</h3>
                <div class="value" id="totalClasses">0</div>
            </div>
            <div class="stat-card green">
                <h3>Fee Collected</h3>
                <div class="value" id="feeCollected">₹0</div>
            </div>
            <div class="stat-card red">
                <h3>Pending Fees</h3>
                <div class="value" id="pendingFees">₹0</div>
            </div>
        </div>

        <div class="chart-grid">
            <div class="chart-container">
                <h3>User Distribution</h3>
                <canvas id="userChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Attendance Overview</h3>
                <canvas id="attendanceChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Marks Distribution</h3>
                <canvas id="marksChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>Fee Status</h3>
                <canvas id="feeChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.SCHOOL_API_BASE_URL || 'http://localhost:5001/api';

        window.onload = () => {
            loadAnalytics();
        };

        async function loadAnalytics() {
            try {
                const response = await fetch(`${API_BASE}/analytics/dashboard/stats`);
                const stats = await response.json();

                document.getElementById('totalUsers').textContent = stats.totalUsers;
                document.getElementById('totalStudents').textContent = stats.totalStudents;
                document.getElementById('totalTeachers').textContent = stats.totalTeachers;
                document.getElementById('totalClasses').textContent = stats.totalClasses;
                document.getElementById('feeCollected').textContent = '₹' + stats.totalFeeCollected;
                document.getElementById('pendingFees').textContent = '₹' + stats.pendingFees;

                // Draw charts
                drawUserChart(stats);
                drawAttendanceChart();
                drawMarksChart();
                drawFeeChart();
            } catch (error) {
                console.error('Error loading analytics:', error);
            }
        }

        function drawUserChart(stats) {
            const ctx = document.getElementById('userChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Students', 'Teachers', 'Admin'],
                    datasets: [{
                        data: [stats.totalStudents, stats.totalTeachers, 1],
                        backgroundColor: ['#3498db', '#2ecc71', '#f39c12']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function drawAttendanceChart() {
            const ctx = document.getElementById('attendanceChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'],
                    datasets: [{
                        label: 'Present',
                        data: [320, 315, 310, 325, 330],
                        backgroundColor: '#2ecc71'
                    }, {
                        label: 'Absent',
                        data: [80, 85, 90, 75, 70],
                        backgroundColor: '#e74c3c'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true }
                    }
                }
            });
        }

        function drawMarksChart() {
            const ctx = document.getElementById('marksChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['0-20', '20-40', '40-60', '60-80', '80-100'],
                    datasets: [{
                        label: 'Number of Students',
                        data: [10, 25, 60, 120, 85],
                        backgroundColor: '#3498db'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y'
                }
            });
        }

        function drawFeeChart() {
            const ctx = document.getElementById('feeChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Paid', 'Pending', 'Overdue'],
                    datasets: [{
                        data: [250, 80, 20],
                        backgroundColor: ['#2ecc71', '#f39c12', '#e74c3c']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }
    </script>
</body>
</html>
