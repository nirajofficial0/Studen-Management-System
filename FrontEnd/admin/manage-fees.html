<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Fees - Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        .status-paid {
            color: green;
            font-weight: bold;
        }
        .status-pending {
            color: orange;
            font-weight: bold;
        }
        .status-overdue {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Fee Management</h1>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Fees Collected</h3>
                <div class="value" id="totalCollected">₹0</div>
            </div>
            <div class="stat-card">
                <h3>Pending Amount</h3>
                <div class="value" id="pendingAmount">₹0</div>
            </div>
            <div class="stat-card">
                <h3>Overdue Records</h3>
                <div class="value" id="overdueCount">0</div>
            </div>
        </div>

        <h2>Fee Records</h2>
        <table id="feeTable">
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Amount</th>
                    <th>Fee Type</th>
                    <th>Month</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th>Payment Method</th>
                    <th>Transaction ID</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE = window.SCHOOL_API_BASE_URL || 'http://localhost:5001/api';

        window.onload = () => {
            loadFees();
            loadStats();
        };

        async function loadFees() {
            try {
                const response = await fetch(`${API_BASE}/fees`);
                const fees = await response.json();
                displayFees(fees);
            } catch (error) {
                console.error('Error loading fees:', error);
            }
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/analytics/fees/stats/all`);
                const stats = await response.json();
                
                document.getElementById('totalCollected').textContent = `₹${stats.totalFeeCollected || 0}`;
                document.getElementById('pendingAmount').textContent = `₹${stats.pendingFees || 0}`;
                document.getElementById('overdueCount').textContent = stats.feeStatus.overdue || 0;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function displayFees(fees) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            fees.forEach(fee => {
                const row = document.createElement('tr');
                const statusClass = `status-${fee.status}`;
                
                row.innerHTML = `
                    <td>${fee.student ? fee.student.name : 'N/A'}</td>
                    <td>₹${fee.amount}</td>
                    <td>${fee.feeType}</td>
                    <td>${fee.month}</td>
                    <td>${new Date(fee.dueDate).toLocaleDateString()}</td>
                    <td><span class="${statusClass}">${fee.status.toUpperCase()}</span></td>
                    <td>${fee.paymentMethod || 'N/A'}</td>
                    <td>${fee.transactionId || 'N/A'}</td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
