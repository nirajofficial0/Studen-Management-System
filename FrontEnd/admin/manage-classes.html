<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Classes - Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 500px;
            border-radius: 8px;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn-edit, .btn-delete {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-edit {
            background-color: #2196F3;
            color: white;
        }
        .btn-delete {
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Manage Classes</h1>
            <button class="btn-primary" onclick="openAddModal()">+ Add New Class</button>
        </div>

        <table id="classTable">
            <thead>
                <tr>
                    <th>Class Name</th>
                    <th>Section</th>
                    <th>Class Teacher</th>
                    <th>Students</th>
                    <th>Academic Year</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>

    <!-- Add/Edit Class Modal -->
    <div id="classModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Add New Class</h2>
            
            <form id="classForm">
                <div class="form-group">
                    <label for="className">Class Name *</label>
                    <input type="text" id="className" required>
                </div>

                <div class="form-group">
                    <label for="section">Section *</label>
                    <input type="text" id="section" required>
                </div>

                <div class="form-group">
                    <label for="classTeacher">Class Teacher</label>
                    <select id="classTeacher">
                        <option value="">Select Teacher</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="academicYear">Academic Year *</label>
                    <input type="text" id="academicYear" placeholder="2023-2024" required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 15px;">Save Class</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.SCHOOL_API_BASE_URL || 'http://localhost:5001/api';
        let classes = [];
        let teachers = [];
        let editingId = null;

        // Load classes on page load
        window.onload = () => {
            loadClasses();
            loadTeachers();
        };

        async function loadClasses() {
            try {
                const response = await fetch(`${API_BASE}/classes`);
                classes = await response.json();
                displayClasses();
            } catch (error) {
                console.error('Error loading classes:', error);
                alert('Failed to load classes');
            }
        }

        async function loadTeachers() {
            try {
                const response = await fetch(`${API_BASE}/users`);
                const users = await response.json();
                teachers = users.filter(u => u.role === 'teacher');
                populateTeacherSelect();
            } catch (error) {
                console.error('Error loading teachers:', error);
            }
        }

        function populateTeacherSelect() {
            const select = document.getElementById('classTeacher');
            teachers.forEach(teacher => {
                const option = document.createElement('option');
                option.value = teacher._id;
                option.text = teacher.name;
                select.appendChild(option);
            });
        }

        function displayClasses() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            classes.forEach(cls => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${cls.name}</td>
                    <td>${cls.section}</td>
                    <td>${cls.classTeacher ? cls.classTeacher.name : 'N/A'}</td>
                    <td>${cls.students ? cls.students.length : 0}</td>
                    <td>${cls.academicYear}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-edit" onclick="editClass('${cls._id}')">Edit</button>
                            <button class="btn-delete" onclick="deleteClass('${cls._id}')">Delete</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add New Class';
            document.getElementById('classForm').reset();
            document.getElementById('classModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('classModal').style.display = 'none';
        }

        function editClass(id) {
            const cls = classes.find(c => c._id === id);
            if (!cls) return;

            editingId = id;
            document.getElementById('modalTitle').textContent = 'Edit Class';
            document.getElementById('className').value = cls.name;
            document.getElementById('section').value = cls.section;
            document.getElementById('classTeacher').value = cls.classTeacher ? cls.classTeacher._id : '';
            document.getElementById('academicYear').value = cls.academicYear;
            document.getElementById('classModal').style.display = 'block';
        }

        async function deleteClass(id) {
            if (!confirm('Are you sure you want to delete this class?')) return;

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE}/classes/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    alert('Class deleted successfully');
                    loadClasses();
                } else {
                    alert('Failed to delete class');
                }
            } catch (error) {
                console.error('Error deleting class:', error);
                alert('Error deleting class');
            }
        }

        document.getElementById('classForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const classData = {
                name: document.getElementById('className').value,
                section: document.getElementById('section').value,
                classTeacher: document.getElementById('classTeacher').value,
                academicYear: document.getElementById('academicYear').value
            };

            try {
                const token = localStorage.getItem('token');
                const url = editingId ? `${API_BASE}/classes/${editingId}` : `${API_BASE}/classes`;
                const method = editingId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(classData)
                });

                if (response.ok) {
                    alert(editingId ? 'Class updated successfully' : 'Class created successfully');
                    closeModal();
                    loadClasses();
                } else {
                    alert('Failed to save class');
                }
            } catch (error) {
                console.error('Error saving class:', error);
                alert('Error saving class');
            }
        });

        window.onclick = (event) => {
            const modal = document.getElementById('classModal');
            if (event.target === modal) {
                closeModal();
            }
        };
    </script>
</body>
</html>
