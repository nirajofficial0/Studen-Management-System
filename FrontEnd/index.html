<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | School Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <h2>School Portal Login</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email or Mobile Number</label>
                    <input type="text" id="loginEmail" placeholder="Enter Email or 10-digit Mobile Number" required autocomplete="username">
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label for="loginPassword" style="margin-bottom: 0;">Password</label>
                        <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                    </div>
                    <input type="password" id="loginPassword" placeholder="Enter Password" required autocomplete="current-password">
                </div>

                <button class="primary-btn" type="submit" style="margin-top: 10px;">Login</button>
            </form>

            <p class="auth-link">New user? <a href="register.html">Register Account</a></p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
